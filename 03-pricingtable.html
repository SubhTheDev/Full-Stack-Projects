<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Comparison Table</title>
  </head>
  <body>
    <header id="Home">
      <h1>Recharge Plans</h1>
      <nav>
        <ul>
          <li><a href="#Home">Home</a></li>
          <li><a href="#Pricing">Pricing</a></li>
          <li><a href="#Contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="Pricing">
        <table>
          <caption>
            Tier Comparison and Included Features
          </caption>
          <thead>
            <tr>
              <th scope="col">Plans</th>
              <th scope="col">Storage</th>
              <th scope="col">Projects</th>
              <th scope="col">Support</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td scope="row">Free</td>
              <td>5 GB</td>
              <td>3</td>
              <td>Email</td>
            </tr>
            <tr>
              <td scope="row">Pro</td>
              <td>100 GB</td>
              <td>25</td>
              <td>Priority Email</td>
            </tr>
            <tr>
              <td scope="row">Business</td>
              <td>1 TB</td>
              <td>Unlimited</td>
              <td>24/7 Phone</td>
            </tr>
          </tbody>

          <tfoot>
            <tr>
              <td colspan="4">Terms and Conditions Apply</td>
            </tr>
          </tfoot>
        </table>
      </section>
    </main>

    <footer id="Contact">
      <p>
        Contact us at :
        <a href="mailto:subhthedeveloper@gmail.com">
          subhthedeveloper@gmail.com</a
        >
      </p>
    </footer>
  </body>
</html>
